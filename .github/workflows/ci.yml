name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Usa a versão do campo engines do package.json.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
